<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurexa — Cybersecurity & Technology Education</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* ==========================================================================
       CSS VARIABLES & THEME (Light Corporate Tech & Navy Accents)
       ========================================================================== */
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --navy: #0f172a;
      --navy-light: #1e293b;
      --navy-subtle: #334155;
      --bg-main: #ffffff;
      --bg-alt: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --border-focus: #38bdf8;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #06b6d4;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Reset & Base Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: var(--transition);
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
    }

    ul {
      list-style: none;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* ==========================================================================
       LAYOUT & UTILITIES
       ========================================================================== */
    .container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .section {
      padding: 5rem 0;
      position: relative;
    }

    .section-alt {
      background-color: var(--bg-alt);
    }

    .section-header {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 3.5rem auto;
    }

    .badge-sub {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--primary);
      background-color: var(--primary-light);
      border-radius: var(--radius-full);
      margin-bottom: 0.85rem;
    }

    .section-title {
      font-size: 2.25rem;
      font-weight: 800;
      color: var(--navy);
      line-height: 1.25;
      margin-bottom: 1rem;
    }

    .section-desc {
      font-size: 1.05rem;
      color: var(--text-muted);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.4rem;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      border: 1px solid transparent;
      transition: var(--transition);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25);
    }

    .btn-primary:hover {
      background-color: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(2, 132, 199, 0.35);
    }

    .btn-outline {
      background-color: transparent;
      border-color: var(--border-color);
      color: var(--navy);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
      background-color: var(--primary-light);
      transform: translateY(-2px);
    }

    .btn-sm {
      padding: 0.45rem 0.9rem;
      font-size: 0.85rem;
      border-radius: var(--radius-sm);
    }

    .btn-danger {
      background-color: var(--danger);
      color: #fff;
    }
    .btn-danger:hover {
      background-color: #dc2626;
    }

    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }

    /* ==========================================================================
       NAVBAR
       ========================================================================== */
    .navbar-wrapper {
      position: sticky;
      top: 0;
      z-index: 1000;
      background-color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      transition: var(--transition);
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.02em;
    }

    .brand-logo .logo-icon {
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
    }

    .brand-logo span {
      background: linear-gradient(135deg, var(--navy) 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 1.4rem;
    }

    .nav-link {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--navy-subtle);
      position: relative;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--primary);
    }

    .nav-admin-btn {
      margin-left: 0.5rem;
      padding: 0.45rem 1rem;
      font-size: 0.85rem;
    }

    .mobile-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 1.4rem;
      color: var(--navy);
      cursor: pointer;
    }

    /* ==========================================================================
       HERO SECTION
       ========================================================================== */
    .hero-section {
      padding: 5rem 0 4rem 0;
      background: radial-gradient(circle at 80% 20%, #f0f9ff 0%, #ffffff 70%);
      overflow: hidden;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 3rem;
      align-items: center;
    }

    .hero-content h1 {
      font-size: 3.1rem;
      font-weight: 800;
      line-height: 1.18;
      color: var(--navy);
      margin-bottom: 1.25rem;
      letter-spacing: -0.03em;
    }

    .hero-content h1 span {
      background: linear-gradient(120deg, var(--primary) 0%, var(--navy-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-content p {
      font-size: 1.125rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .hero-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .hero-visual {
      position: relative;
    }

    .hero-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: var(--shadow-xl);
      position: relative;
    }

    .terminal-box {
      background: #0f172a;
      border-radius: var(--radius-md);
      padding: 1.25rem;
      color: #38bdf8;
      font-family: monospace;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }

    .terminal-header {
      display: flex;
      gap: 6px;
      margin-bottom: 0.75rem;
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #10b981; }

    .hero-floating-badge {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: #ffffff;
      padding: 0.9rem 1.2rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      margin-top: 1rem;
    }

    /* ==========================================================================
       STATS BAR
       ========================================================================== */
    .stats-section {
      background: #ffffff;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 2.5rem 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 1.5rem;
      text-align: center;
    }

    .stat-item h3 {
      font-size: 2.25rem;
      font-weight: 800;
      color: var(--primary-dark);
      margin-bottom: 0.25rem;
    }

    .stat-item p {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* ==========================================================================
       ABOUT & WHY US
       ========================================================================== */
    .about-cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.75rem;
      margin-top: 2rem;
    }

    .about-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .about-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: #cbd5e1;
    }

    .about-icon {
      width: 50px;
      height: 50px;
      border-radius: var(--radius-md);
      background-color: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      margin-bottom: 1.25rem;
    }

    .about-card h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 0.6rem;
    }

    .about-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    /* ==========================================================================
       SERVICES
       ========================================================================== */
    .service-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .service-card:hover {
      border-color: var(--primary);
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .service-icon {
      width: 46px;
      height: 46px;
      background: #f0fdf4;
      color: #16a34a;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      margin-bottom: 1rem;
    }

    .service-card:nth-child(2n) .service-icon {
      background: #eff6ff;
      color: var(--primary);
    }

    .service-card:nth-child(3n) .service-icon {
      background: #faf5ff;
      color: #9333ea;
    }

    /* ==========================================================================
       DYNAMIC CARDS (Courses, Workshops, Internships, Projects, Team)
       ========================================================================== */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }

    .filter-btn {
      padding: 0.45rem 1.1rem;
      border-radius: var(--radius-full);
      background: #ffffff;
      border: 1px solid var(--border-color);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--navy-subtle);
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .search-input-group {
      max-width: 480px;
      margin: 0 auto 2rem auto;
      position: relative;
    }

    .search-input-group input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-color);
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
    }

    .search-input-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .search-input-group i {
      position: absolute;
      left: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
    }

    /* Course Cards */
    .course-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .course-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .course-img {
      height: 180px;
      width: 100%;
      object-fit: cover;
      background: #e2e8f0;
    }

    .course-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .course-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 0.5rem;
    }

    .course-difficulty {
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      background: #f1f5f9;
      color: var(--navy-subtle);
    }

    .course-title {
      font-size: 1.18rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 0.5rem;
    }

    .course-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }

    .course-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border-color);
      padding-top: 1rem;
    }

    .course-price {
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--navy);
    }

    /* Workshop & Internship Cards */
    .item-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .item-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .item-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 0.75rem;
    }

    .tag-blue { background: #e0f2fe; color: #0369a1; }
    .tag-green { background: #dcfce7; color: #15803d; }
    .tag-purple { background: #f3e8ff; color: #7e22ce; }

    /* Project Showcase */
    .project-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .project-img {
      height: 190px;
      width: 100%;
      object-fit: cover;
    }

    .project-body {
      padding: 1.5rem;
    }

    .tech-pill {
      display: inline-block;
      background: #f1f5f9;
      color: var(--navy-subtle);
      font-size
