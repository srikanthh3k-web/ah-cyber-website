<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AUREXA | Cybersecurity • Technology • Innovation</title>
    <link rel="icon" type="image/jpeg" href="1000033532.jpg">
    <style>
        /* ==========================================================================
           1. CSS VARIABLES & RESET
           ========================================================================== */
        :root {
            --primary: #0f172a;        /* Deep Navy */
            --primary-light: #1e293b;  
            --secondary: #1e3a8a;      /* Professional Blue */
            --accent: #2563eb;         /* Vibrant Blue */
            --accent-hover: #1d4ed8;
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            
            /* Severity Colors */
            --critical: #dc2626;
            --high: #ea580c;
            --medium: #ca8a04;
            --low: #16a34a;
            --info: #0284c7;

            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s ease;
            
            /* Safe Area for Mobile */
            --sab: env(safe-area-inset-bottom, 0px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 60px; /* Space for mobile bar */
        }
        
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        button, input, textarea, select { font-family: inherit; outline: none; border: none; }
        button { cursor: pointer; background: none; transition: var(--transition); }
        img { max-width: 100%; height: auto; display: block; }
        
        /* ==========================================================================
           2. UTILITIES & LAYOUT (MOBILE FIRST)
           ========================================================================== */
        .container { width: 100%; padding: 0 1.25rem; margin: 0 auto; }
        
        .flex { display: flex; } .col { flex-direction: column; }
        .items-center { align-items: center; } .justify-between { justify-content: space-between; } .justify-center { justify-content: center; }
        .gap-2 { gap: 0.5rem; } .gap-4 { gap: 1rem; } .gap-6 { gap: 1.5rem; } .gap-8 { gap: 2rem; }
        
        .grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
        
        .text-center { text-align: center; } 
        .font-bold { font-weight: 700; } .font-semibold { font-weight: 600; }
        
        .text-xs { font-size: 0.75rem; } .text-sm { font-size: 0.875rem; } 
        .text-base { font-size: 1rem; } .text-lg { font-size: 1.125rem; } 
        .text-xl { font-size: 1.25rem; } .text-2xl { font-size: 1.5rem; } 
        .text-3xl { font-size: 2rem; } .text-4xl { font-size: 2.5rem; }
        
        .text-primary { color: var(--primary); } .text-accent { color: var(--accent); } 
        .text-white { color: #fff; } .text-muted { color: var(--text-muted); }
        
        .p-4 { padding: 1rem; } .p-6 { padding: 1.5rem; } .p-8 { padding: 2rem; }
        .py-12 { padding: 3rem 0; } .py-16 { padding: 4rem 0; }
        
        .mb-2 { margin-bottom: 0.5rem; } .mb-4 { margin-bottom: 1rem; } 
        .mb-6 { margin-bottom: 1.5rem; } .mb-8 { margin-bottom: 2rem; }
        
        .hidden { display: none !important; }
        
        /* Components */
        .btn { padding: 0.75rem 1.5rem; border-radius: var(--radius-sm); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; text-align: center; width: 100%; }
        .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 14px 0 rgba(37,99,235,0.3); }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); }
        .btn-outline { border: 2px solid var(--border-color); color: var(--primary); background: var(--bg-surface); }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
        .btn-danger { background: var(--critical); color: #fff; }
        
        .card { background: var(--bg-surface); border-radius: var(--radius-md); padding: 1.5rem; box-shadow: var(--shadow); border: 1px solid var(--border-color); transition: var(--transition); }
        .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        
        .badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; display: inline-block; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-info { background: #e0f2fe; color: var(--info); }
        .badge-critical { background: #fee2e2; color: var(--critical); }
        .badge-high { background: #ffedd5; color: var(--high); }
        .badge-medium { background: #fef9c3; color: var(--medium); }
        .badge-low { background: #dcfce7; color: var(--low); }

        .input-group { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .input-group label { font-size: 0.875rem; font-weight: 600; color: var(--primary); }
        .input-control { width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background: var(--bg-body); transition: var(--transition); font-size: 1rem; }
        .input-control:focus { border-color: var(--accent); background: var(--bg-surface); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

        /* ==========================================================================
           3. PUBLIC UI (MOBILE FIRST)
           ========================================================================== */
        
        /* Navbar */
        header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-color); }
        .nav-container { display: flex; justify-content: space-between; align-items: center; height: 70px; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 0.5rem; letter-spacing: 0.5px; }
        .logo img { height: 32px; width: 32px; border-radius: 4px; object-fit: cover; }
        
        /* Mobile Menu */
        .mobile-menu-btn { font-size: 1.5rem; color: var(--primary); }
        .nav-links { position: fixed; top: 70px; left: -100%; width: 100%; height: calc(100vh - 70px); background: var(--bg-surface); flex-direction: column; padding: 2rem; gap: 1.5rem; transition: var(--transition); z-index: 99; overflow-y: auto; }
        .nav-links.active { left: 0; }
        .nav-links a { font-weight: 600; font-size: 1.25rem; color: var(--primary); border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; display: block; }
        
        .nav-actions { display: flex; align-items: center; gap: 1rem; }
        .alert-bell { position: relative; font-size: 1.25rem; cursor: pointer; color: var(--primary); }
        .alert-badge { position: absolute; top: -5px; right: -8px; background: var(--critical); color: #fff; font-size: 0.65rem; font-weight: bold; height: 18px; width: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        /* Mobile Bottom Contact Bar */
        .mobile-contact-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--primary); display: flex; justify-content: space-around; padding: 0.75rem 0; padding-bottom: calc(0.75rem + var(--sab)); z-index: 90; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); }
        .mobile-contact-bar a { color: #fff; display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; gap: 0.25rem; font-weight: 500; }
        .mobile-contact-bar i { font-size: 1.25rem; font-style: normal; }

        /* Sections */
        .section-header { text-align: center; margin-bottom: 2rem; }
        .section-header h2 { font-size: 2rem; color: var(--primary); margin-bottom: 0.5rem; }
        .section-header p { color: var(--text-muted); font-size: 1rem; }

        /* Hero */
        .hero { padding: 4rem 0; text-align: center; background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%); position: relative; overflow: hidden; }
        .hero h1 { line-height: 1.2; margin-bottom: 1rem; }
        
        /* Cards */
        .news-img, .course-img, .project-img { width: 100%; height: 180px; object-fit: cover; border-radius: var(--radius-sm) var(--radius-sm) 0 0; margin: -1.5rem -1.5rem 1.5rem -1.5rem; width: calc(100% + 3rem); }
        
        /* Founder Section */
        .founder-card { text-align: center; }
        .founder-photo { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; margin: 0 auto 1.5rem auto; border: 4px solid var(--bg-surface); box-shadow: var(--shadow-lg); }

        /* Footer */
        footer { background: var(--primary); color: #cbd5e1; padding: 3rem 0 5rem 0; /* extra padding for mobile bar */ }
        footer h3 { color: #fff; margin-bottom: 1rem; font-size: 1.25rem; }
        footer a { color: #cbd5e1; display: block; margin-bottom: 0.5rem; transition: var(--transition); }
        footer a:hover { color: #fff; }

        /* ==========================================================================
           4. MODALS & TOASTS
           ========================================================================== */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.8); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: flex-end; /* Bottom sheet on mobile */ opacity: 0; pointer-events: none; transition: var(--transition); }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: var(--bg-surface); width: 100%; max-height: 90vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 2rem 1.5rem; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; padding-bottom: calc(2rem + var(--sab)); }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-close { position: absolute; top: 1rem; right: 1.5rem; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; border: none; background: none; }

        .toast-container { position: fixed; top: 1rem; right: 1rem; left: 1rem; z-index: 2000; display: flex; flex-direction: column; gap: 0.5rem; pointer-events: none; }
        .toast { background: var(--bg-surface); border-left: 4px solid var(--accent); padding: 1rem; border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 0.75rem; transform: translateY(-20px); opacity: 0; transition: var(--transition); pointer-events: auto; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-left-color: var(--low); } .toast.error { border-left-color: var(--critical); } .toast.warning { border-left-color: var(--medium); }

        /* ==========================================================================
           5. ADMIN UI (MOBILE FIRST)
           ========================================================================== */
        .admin-layout { display: flex; flex-direction: column; min-height: 100vh; background: var(--bg-body); padding-bottom: 0; }
        .admin-sidebar { position: fixed; top: 0; left: -100%; width: 280px; height: 100vh; background: var(--primary); color: #fff; z-index: 200; transition: var(--transition); overflow-y: auto; }
        .admin-sidebar.active { left: 0; }
        .admin-sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 199; display: none; }
        .admin-sidebar-overlay.active { display: block; }
        
        .admin-logo { padding: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 1.25rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .admin-nav a { display: block; padding: 1rem 1.5rem; color: #cbd5e1; border-left: 3px solid transparent; transition: var(--transition); }
        .admin-nav a.active, .admin-nav a:hover { background: rgba(255,255,255,0.05); color: #fff; border-left-color: var(--accent); }
        
        .admin-main { flex: 1; width: 100%; }
        .admin-header { background: var(--bg-surface); padding: 1rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 90; }
        .admin-content { padding: 1rem; }
        
        /* Mobile Admin Tables (Cards) */
        .admin-table-container { width: 100%; }
        .admin-table { width: 100%; border-collapse: collapse; display: block; }
        .admin-table thead { display: none; } /* Hide headers on mobile */
        .admin-table tbody, .admin-table tr, .admin-table td { display: block; width: 100%; }
        .admin-table tr { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-sm); margin-bottom: 1rem; padding: 1rem; box-shadow: var(--shadow-sm); }
        .admin-table td { padding: 0.25rem 0; border: none; display: flex; justify-content: space-between; align-items: center; text-align: right; }
        .admin-table td::before { content: attr(data-label); font-weight: 600; color: var(--text-muted); font-size: 0.85rem; text-align: left; }
        .admin-table td.actions { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color); justify-content: flex-end; gap: 0.5rem; }

        /* ==========================================================================
           6. DESKTOP SPECIFIC OVERRIDES (MIN-WIDTH: 1024px)
           ========================================================================== */
        @media (min-width: 1024px) {
            body { padding-bottom: 0; } /* Remove mobile bar space */
            .mobile-contact-bar { display: none; }
            .container { max-width: 1280px; padding: 0 2rem; }
            .grid { grid-template-columns: repeat(3, 1fr); }
            
            .btn { width: auto; display: inline-flex; }
            
            /* Navbar */
            .mobile-menu-btn { display: none; }
            .nav-links { position: static; height: auto; width: auto; background: none; flex-direction: row; padding: 0; overflow: visible; }
            .nav-links a { border: none; padding: 0; font-size: 1rem; font-weight: 500; color: var(--text-muted); }
            .nav-links a:hover { color: var(--accent); }
            
            /* Sections & Typography */
            .section-header h2 { font-size: 2.5rem; }
            .hero { padding: 8rem 0; }
            .hero h1 { font-size: 3.5rem; }
            
            /* Specific Grids */
            #stats .grid { grid-template-columns: repeat(4, 1fr); }
            #footer .grid { grid-template-columns: 2fr 1fr 1fr 1fr; }
            
            /* Founder Section */
            .founder-card { text-align: left; display: flex; gap: 3rem; align-items: center; padding: 3rem; }
            .founder-photo { width: 320px; height: 320px; margin: 0; flex-shrink: 0; }
            
            /* Modals */
            .modal-overlay { align-items: center; }
            .modal-content { max-width: 700px; border-radius: var(--radius-md); padding: 3rem; transform: translateY(20px) scale(0.95); padding-bottom: 3rem; }
            .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }
            .toast-container { top: 2rem; right: 2rem; left: auto; max-width: 400px; }
            
            /* Admin Layout */
            .admin-layout { flex-direction: row; }
            .admin-sidebar { position: sticky; left: 0; height: 100vh; transform: none; }
            .admin-sidebar-overlay { display: none !important; }
            .admin-sidebar .close-sidebar { display: none; }
            .admin-header { padding: 1.5rem 3rem; }
            .admin-content { padding: 3rem; }
            
            /* Desktop Admin Tables */
            .admin-table { display: table; }
            .admin-table thead { display: table-header-group; }
            .admin-table tbody, .admin-table tr, .admin-table td { display: table-cell; width: auto; }
            .admin-table tr { margin: 0; border: none; border-bottom: 1px solid var(--border-color); border-radius: 0; padding: 0; box-shadow: none; background: transparent; }
            .admin-table tr:hover { background: rgba(0,0,0,0.02); }
            .admin-table th { text-align: left; padding: 1rem; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; border-bottom: 2px solid var(--border-color); }
            .admin-table td { text-align: left; padding: 1rem; }
            .admin-table td::before { content: none; }
            .admin-table td.actions { border: none; margin: 0; padding: 1rem; justify-content: flex-start; }
            
            .dashboard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }
        }

        /* Chart placeholder */
        .chart-bar { background: var(--accent); border-radius: 4px 4px 0 0; width: 100%; transition: height 1s ease; }
        .chart-container { height: 200px; display: flex; align-items: flex-end; gap: 0.5rem; border-bottom: 1px solid var(--border-color); padding-top: 1rem; }

    </style>
</head>
<body>

    <!-- Main Application Container -->
    <div id="app"></div>

    <!-- Modals & Toasts Container -->
    <div id="modal-root"></div>
    <div class="toast-container" id="toast-root"></div>

    <script>
        /************************************************************************
         * 1. SYSTEM CONFIGURATION & ARCHITECTURE
         ************************************************************************/
        // Ready for future real API integration
        const CONFIG = {
            NEWS_API_URL: "", 
            NEWS_API_KEY: "",
            ADMIN_USER: "admin",
            ADMIN_PASS: "Aurexa@2026"
        };

        // Allowed Database Keys (STRICTLY NO INTERNSHIP OR STUDENT DATA)
        const DB_KEYS = [
            'aurexa_settings', 'aurexa_courses', 'aurexa_workshops', 'aurexa_workshop_registrations', 
            'aurexa_projects', 'aurexa_project_submissions', 'aurexa_team', 'aurexa_testimonials', 
            'aurexa_faqs', 'aurexa_messages', 'aurexa_subscribers', 'aurexa_news', 
            'aurexa_alerts', 'aurexa_notifications', 'aurexa_audit_logs'
        ];

        const DB = {
            get: (key) => JSON.parse(localStorage.getItem(key) || '[]'),
            getObj: (key) => JSON.parse(localStorage.getItem(key) || '{}'),
            set: (key, val) => localStorage.setItem(key, JSON.stringify(val)),
            add: (key, item) => {
                const data = DB.get(key);
                item.id = Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
                item.createdAt = new Date().toISOString();
                data.push(item);
                DB.set(key, data);
                return item;
            },
            update: (key, id, updates) => {
                const data = DB.get(key);
                const idx = data.findIndex(i => i.id === id);
                if(idx > -1) { data[idx] = { ...data[idx], ...updates, updatedAt: new Date().toISOString() }; DB.set(key, data); }
            },
            remove: (key, id) => DB.set(key, DB.get(key).filter(i => i.id !== id)),
            log: (action, user = 'Admin') => DB.add('aurexa_audit_logs', { action, user, date: new Date().toLocaleString() }),
            notify: (title, desc, type='info') => DB.add('aurexa_notifications', { title, desc, type, read: false })
        };

        /************************************************************************
         * 2. INITIALIZE DEMO DATA
         ************************************************************************/
        function initDemoData() {
            if(!localStorage.getItem('aurexa_settings')) {
                DB.set('aurexa_settings', {
                    brandName: 'AUREXA',
                    logoUrl: '1000033532.jpg',
                    founderName: 'Srikanth Paka',
                    founderRole: 'Founder & CEO — Aurexa',
                    founderBio: 'Srikanth Paka is the Founder of Aurexa, a technology-focused initiative dedicated to cybersecurity, artificial intelligence, digital safety, and innovation. He is focused on transforming technology ideas into practical solutions that help people and organizations navigate the digital world more securely.',
                    founderVision: '“To build Aurexa into a trusted technology and cybersecurity organization driven by innovation, security, and real-world impact.”',
                    founderImg: '1000033527.jpg',
                    email: 'hello@aurexa.space', 
                    phone: '+91 9876543210', 
                    whatsapp: '919876543210',
                    linkedin: 'https://linkedin.com',
                    instagram: 'https://instagram.com'
                });

                DB.add('aurexa_alerts', { title: 'New Ransomware Variant Detected', severity: 'Critical', date: new Date().toISOString().split('T')[0], desc: 'A high-impact ransomware strain is targeting educational institutions. Patch critical systems immediately.', action: 'Update Firewall Rules', active: true });
                DB.add('aurexa_news', { headline: 'Global Data Breach Affects Millions', category: 'Data Breaches', severity: 'High', source: 'CyberNews', date: new Date().toISOString().split('T')[0], summary: 'A massive leak exposed personal data across multiple tech platforms.', img: 'https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=500', active: true });
                
                DB.add('aurexa_courses', { title: 'Ethical Hacking Masterclass', category: 'Cybersecurity', level: 'Intermediate', duration: '6 Weeks', originalPrice: '₹5,000', price: '₹1,000', instructor: 'Srikanth Paka', desc: 'Comprehensive real-world penetration testing and offensive security.', img: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=500' });
                DB.add('aurexa_workshops', { title: 'Cloud Security Fundamentals', date: '2026-10-15', time: '10:00 AM', speaker: 'Aurexa Team', mode: 'Online', seats: 50, status: 'Open', desc: 'Learn to secure AWS and Azure environments.' });
                DB.add('aurexa_projects', { title: 'Automated Vulnerability Scanner', category: 'Automation', tech: 'Python, Bash', desc: 'A custom tool built to scan networks for CVEs.', github: '#', demo: '#' });
                
                DB.log('System initialized with clean demo data');
            }
        }

        /************************************************************************
         * 3. UI UTILITIES (Toasts, Modals, Menus)
         ************************************************************************/
        function showToast(msg, type = 'success') {
            const root = document.getElementById('toast-root');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️';
            toast.innerHTML = `<span style="font-size:1.25rem">${icon}</span> <div style="font-size:0.875rem; font-weight:500;">${msg}</div>`;
            root.appendChild(toast);
            
            // Trigger reflow for animation
            void toast.offsetWidth; 
            toast.classList.add('show');
            
            setTimeout(() => { 
                toast.classList.remove('show'); 
                setTimeout(() => toast.remove(), 300); 
            }, 3000);
        }

        function openModal(content) {
            const root = document.getElementById('modal-root');
            root.innerHTML = `
                <div class="modal-overlay active" id="modal-overlay" onclick="if(event.target.id==='modal-overlay') closeModal()">
                    <div class="modal-content">
                        <button class="modal-close" onclick="closeModal()">×</button>
                        ${content}
                    </div>
                </div>
            `;
            document.body.style.overflow = 'hidden';
        }
        function closeModal() { document.getElementById('modal-root').innerHTML = ''; document.body.style.overflow = ''; }

        function toggleMobileMenu() {
            const menu = document.getElementById('nav-links');
            menu.classList.toggle('active');
        }

        function toggleAdminSidebar() {
            document.getElementById('adminSidebar').classList.toggle('active');
            document.getElementById('adminOverlay').classList.toggle('active');
        }

        // Global Search (Ctrl+K)
        document.addEventListener('keydown', e => {
            if((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                openModal(`
                    <h3 class="text-2xl font-bold mb-4 text-primary">Aurexa Search</h3>
                    <input type="text" class="input-control" placeholder="Search news, courses, projects..." onkeyup="handleSearch(this.value)" id="searchInput" autocomplete="off">
                    <div id="searchResults" class="mt-4 flex col gap-2"></div>
                `);
                setTimeout(() => document.getElementById('searchInput').focus(), 100);
            }
        });

        window.handleSearch = (query) => {
            const res = document.getElementById('searchResults');
            if(query.length < 2) { res.innerHTML = ''; return; }
            const q = query.toLowerCase();
            let html = '';

            columns.forEach(c => html += `<th>${c.label}</th>`);
            html += `<th>Actions</th></tr></thead><tbody>`;
            
            if(data.length === 0) html += `<tr><td colspan="${columns.length+1}" style="text-align:center;">No records found.</td></tr>`;
            
            data.forEach(row => {
                html += `<tr>`;
                columns.forEach(c => html += `<td data-label="${c.label}">${row[c.key] || '-'}</td>`);
                html += `<td data-label="Actions" class="actions">
                    <button class="text-accent font-bold text-sm" onclick="alert('Edit ${row.id}')">Edit</button>
                    <button class="text-critical font-bold text-sm ml-4" onclick="deleteRecord('${key}', '${row.id}')">Delete</button>
                </td></tr>`;
            });
            html += `</tbody></table></div>`;
            return html;
        }

        window.deleteRecord = (key, id) => {
            if(confirm('Delete this record permanently?')) {
                DB.remove(key, id);
                DB.log(`Deleted record from ${key}`);
                showToast('Record deleted successfully');
                renderApp();
            }
        };

        function renderAdminSettings() {
            const set = DB.getObj('aurexa_settings');
            return `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <form class="card" onsubmit="saveSettings(event)">
                        <h3 class="font-bold mb-4 text-primary">Founder & Brand Profile</h3>
                        <div class="input-group"><label>Brand Name</label><input type="text" id="s_brand" class="input-control" value="${set.brandName}"></div>
                        <div class="input-group"><label>Founder Name</label><input type="text" id="s_fName" class="input-control" value="${set.founderName}"></div>
                        <div class="input-group"><label>Founder Photo URL (e.g., 1000033527.jpg)</label><input type="text" id="s_fImg" class="input-control" value="${set.founderImg}"></div>
                        <div class="input-group"><label>Contact Mobile</label><input type="text" id="s_phone" class="input-control" value="${set.phone}"></div>
                        <div class="input-group"><label>WhatsApp Number</label><input type="text" id="s_wa" class="input-control" value="${set.whatsapp}"></div>
                        <button type="submit" class="btn btn-primary mt-4">Save Changes</button>
                    </form>
                    
                    <div class="card">
                        <h3 class="font-bold mb-4 text-primary">Data Export</h3>
                        <p class="text-sm text-text-muted mb-6">Download system data in CSV format for external reporting.</p>
                        <div class="flex col gap-4">
                            <button class="btn btn-outline" onclick="exportCSV('aurexa_news')">Download Cyber News (CSV)</button>
                            <button class="btn btn-outline" onclick="exportCSV('aurexa_messages')">Download Messages (CSV)</button>
                            <button class="btn btn-danger mt-8" onclick="resetSystemData()">⚠️ Factory Reset Demo Data</button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.saveSettings = (e) => {
            e.preventDefault();
            const set = DB.getObj('aurexa_settings');
            set.brandName = document.getElementById('s_brand').value;
            set.founderName = document.getElementById('s_fName').value;
            set.founderImg = document.getElementById('s_fImg').value;
            set.phone = document.getElementById('s_phone').value;
            set.whatsapp = document.getElementById('s_wa').value;
            DB.set('aurexa_settings', set);
            DB.log('Updated System Settings');
            showToast('Settings saved successfully');
        };

        window.exportCSV = (key) => {
            const data = DB.get(key);
            if(!data.length) { showToast('No data available', 'warning'); return; }
            const headers = Object.keys(data[0]).join(',');
            const rows = data.map(o => Object.values(o).map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
            const blob = new Blob([headers + '\n' + rows], {type: 'text/csv'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Aurexa_${key}.csv`; a.click();
            DB.log(`Exported CSV for ${key}`);
        };

        window.resetSystemData = () => {
            if(confirm('CRITICAL WARNING: This will permanently delete all local demo data. Continue?')) {
                localStorage.clear();
                showToast('System reset. Reloading...');
                setTimeout(() => window.location.reload(), 1500);
            }
        };

        /************************************************************************
         * 6. CORE ROUTER & INITIALIZATION
         ************************************************************************/
        function renderApp() {
            const app = document.getElementById('app');
            const hash = window.location.hash || '#home';
            
            if(hash.startsWith('#admin')) {
                if(!sessionStorage.getItem('aurexa_admin')) { app.innerHTML = renderAdminLogin(); return; }
                
                const route = hash.split('/')[1] || 'dashboard';
                let content = '';
                
                if(route === 'dashboard') content = renderAdminDashboard();
                else if(route === 'news') content = renderAdminTable('Cyber News Management', 'aurexa_news', [{label:'Headline', key:'headline'}, {label:'Severity', key:'severity'}, {label:'Date', key:'date'}]);
                else if(route === 'alerts') content = renderAdminTable('Security Alerts', 'aurexa_alerts', [{label:'Title', key:'title'}, {label:'Severity', key:'severity'}]);
                else if(route === 'courses') content = renderAdminTable('Course Management', 'aurexa_courses', [{label:'Title', key:'title'}, {label:'Offer Price', key:'price'}]);
                else if(route === 'messages') content = renderAdminTable('Inbox Messages', 'aurexa_messages', [{label:'Name', key:'name'}, {label:'Email', key:'email'}]);
                else if(route === 'settings') content = renderAdminSettings();
                
                app.innerHTML = renderAdminLayout(content, route);
            } 
            else {
                // Public SPA
                app.innerHTML = renderNavbar() + renderHome() + renderFooter();
                
                // Smooth scroll to section if hash matches
                if(hash !== '#home' && document.querySelector(hash)) {
                    setTimeout(() => document.querySelector(hash).scrollIntoView({behavior: 'smooth'}), 50);
                }
            }
        }

        // Bind Events
        window.addEventListener('hashchange', renderApp);
        window.addEventListener('DOMContentLoaded', () => { initDemoData(); renderApp(); });

    </script>
</body>
</html>
