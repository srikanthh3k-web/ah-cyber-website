<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUREXA | Empowering the Next Generation of Cybersecurity & Technology</title>
    <style>
        /* CSS RESET & VARIABLES */
        :root {
            --primary: #0f172a; --secondary: #1e3a8a; --accent: #2563eb; --accent-hover: #1d4ed8;
            --bg: #f8fafc; --surface: #ffffff; --text: #334155; --text-light: #64748b;
            --border: #e2e8f0; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --info: #3b82f6;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius: 12px; --radius-sm: 8px; --transition: all 0.3s ease;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; font-size: 16px; overflow-x: hidden; scroll-behavior: smooth; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        button, input, textarea, select { font-family: inherit; border: none; outline: none; }
        button { cursor: pointer; background: transparent; transition: var(--transition); }
        
        /* UTILITIES */
        .container { max-width: 1280px; margin: 0 auto; padding: 0 1.5rem; }
        .flex { display: flex; } .col { flex-direction: column; }
        .items-center { align-items: center; } .justify-between { justify-content: space-between; } .justify-center { justify-content: center; }
        .gap-2 { gap: 0.5rem; } .gap-4 { gap: 1rem; } .gap-6 { gap: 1.5rem; } .gap-8 { gap: 2rem; }
        .grid { display: grid; } .grid-cols-1 { grid-template-columns: 1fr; } 
        .grid-cols-2 { grid-template-columns: repeat(2, 1fr); } .grid-cols-3 { grid-template-columns: repeat(3, 1fr); } .grid-cols-4 { grid-template-columns: repeat(4, 1fr); }
        .text-center { text-align: center; } .text-primary { color: var(--primary); } .text-accent { color: var(--accent); } .text-white { color: #fff; }
        .font-bold { font-weight: 700; } .font-semibold { font-weight: 600; }
        .text-sm { font-size: 0.875rem; } .text-lg { font-size: 1.125rem; } .text-xl { font-size: 1.25rem; } .text-2xl { font-size: 1.5rem; } .text-4xl { font-size: 2.25rem; }
        .p-4 { padding: 1rem; } .p-6 { padding: 1.5rem; } .p-8 { padding: 2rem; } .py-16 { padding: 4rem 0; } .my-8 { margin: 2rem 0; }
        .hidden { display: none !important; }
        
        /* COMPONENTS */
        .btn { padding: 0.75rem 1.5rem; border-radius: var(--radius-sm); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 14px 0 rgba(37,99,235,0.39); }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37,99,235,0.4); }
        .btn-outline { border: 2px solid var(--border); color: var(--primary); background: var(--surface); }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
        .btn-danger { background: var(--danger); color: #fff; }
        
        .card { background: var(--surface); border-radius: var(--radius); padding: 1.5rem; box-shadow: var(--shadow); border: 1px solid var(--border); transition: var(--transition); }
        .card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); border-color: var(--accent); }
        .badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; background: #eff6ff; color: var(--secondary); display: inline-block; }
        
        .input-group { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .input-group label { font-size: 0.875rem; font-weight: 600; color: var(--primary); }
        .input-control { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); transition: var(--transition); }
        .input-control:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        
        /* LAYOUT & SPECIFICS */
        #announcement { background: linear-gradient(90deg, var(--primary), var(--secondary)); color: #fff; text-align: center; padding: 0.5rem; font-size: 0.875rem; font-weight: 500; }
        header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .nav-container { display: flex; justify-content: space-between; align-items: center; height: 70px; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); letter-spacing: 0.5px; display: flex; align-items: center; gap: 0.5rem; }
        .nav-links { display: flex; gap: 1.5rem; } .nav-links a { font-weight: 500; color: var(--text-light); } .nav-links a:hover { color: var(--accent); }
        
        .hero { position: relative; padding: 6rem 0; overflow: hidden; background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%); text-align: center; }
        .hero::before { content:''; position:absolute; top:0;left:0; right:0;bottom:0; background: radial-gradient(circle at center, rgba(37,99,235,0.05) 0%, transparent 70%); pointer-events: none; }
        .trust-strip { background: var(--surface); padding: 1.5rem 0; border-y: 1px solid var(--border); display: flex; justify-content: center; gap: 3rem; flex-wrap: wrap; font-weight: 600; color: var(--text-light); }
        
        .section-header { text-align: center; margin-bottom: 3rem; }
        .section-header h2 { font-size: 2.5rem; color: var(--primary); margin-bottom: 1rem; }
        .section-header p { color: var(--text-light); max-width: 600px; margin: 0 auto; font-size: 1.125rem; }
        
        .course-img { width: 100%; height: 200px; object-fit: cover; border-radius: var(--radius-sm); margin-bottom: 1rem; }
        .founder-img { width: 300px; height: 300px; border-radius: var(--radius); object-fit: cover; border: 4px solid #fff; box-shadow: var(--shadow-lg); }
        
        footer { background: var(--primary); color: #cbd5e1; padding: 4rem 0 2rem; margin-top: 4rem; }
        footer h3 { color: #fff; margin-bottom: 1.5rem; font-size: 1.25rem; }
        footer a { transition: var(--transition); } footer a:hover { color: #fff; }
        
        /* MODALS & TOASTS */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 1000; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: var(--transition); }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: var(--surface); padding: 2rem; border-radius: var(--radius); width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; transform: translateY(20px); transition: var(--transition); position: relative; }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; color: var(--text-light); cursor: pointer; }
        
        .toast-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 2000; display: flex; flex-direction: column; gap: 1rem; }
        .toast { background: var(--surface); border-left: 4px solid var(--accent); padding: 1rem 1.5rem; border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 1rem; animation: slideIn 0.3s ease forwards; }
        .toast.success { border-left-color: var(--success); } .toast.error { border-left-color: var(--danger); } .toast.warning { border-left-color: var(--warning); }
        
        /* ADMIN UI */
        .admin-layout { display: flex; min-height: 100vh; background: var(--bg); }
        .admin-sidebar { width: 260px; background: var(--primary); color: #fff; display: flex; flex-direction: column; }
        .admin-sidebar .logo { padding: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); color: #fff; }
        .admin-nav { flex: 1; overflow-y: auto; padding: 1rem 0; }
        .admin-nav a { display: block; padding: 0.75rem 1.5rem; color: #cbd5e1; transition: var(--transition); border-left: 3px solid transparent; }
        .admin-nav a:hover, .admin-nav a.active { background: rgba(255,255,255,0.1); color: #fff; border-left-color: var(--accent); }
        .admin-main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .admin-header { background: var(--surface); padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .admin-content { flex: 1; padding: 2rem; overflow-y: auto; }
        
        table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius-sm); overflow: hidden; box-shadow: var(--shadow-sm); }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: var(--bg); font-weight: 600; color: var(--text-light); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; }
        tr:hover { background: var(--bg); }
        
        .chart-bar { background: var(--accent); border-radius: 4px 4px 0 0; transition: height 1s ease; width: 40px; }
        .chart-container { height: 200px; display: flex; align-items: flex-end; gap: 1rem; padding-top: 1rem; border-bottom: 1px solid var(--border); }

        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* RESPONSIVE */
        @media (max-width: 1024px) { .grid-cols-4 { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) {
            .grid-cols-3, .grid-cols-4 { grid-template-columns: 1fr; } .grid-cols-2 { grid-template-columns: 1fr; }
            .nav-links { display: none; } /* Simplified mobile for demo */
            .hero { padding: 4rem 1rem; } .text-4xl { font-size: 2rem; }
            .admin-layout { flex-direction: column; } .admin-sidebar { width: 100%; height: auto; } .admin-main { height: auto; overflow: visible; }
        }
    </style>
</head>
<body>

    <div id="app"></div>
    <div id="modal-root"></div>
    <div class="toast-container" id="toast-root"></div>

    <script>
        /*******************************************************
         * 1. SYSTEM CONFIG & DATABASE (localStorage)
         *******************************************************/
        // IMPORTANT: Demo frontend authentication only. Production requires secure server-side authentication.
        const ADMIN_CREDS = { user: "admin", pass: "Aurexa@2026" };
        
        // NO INTERNSHIPS INCLUDED.
        const DB_KEYS = [
            'aurexa_users', 'aurexa_courses', 'aurexa_workshops', 'aurexa_workshop_registrations', 
            'aurexa_projects', 'aurexa_project_submissions', 'aurexa_team', 'aurexa_testimonials', 
            'aurexa_faqs', 'aurexa_messages', 'aurexa_subscribers', 'aurexa_notifications', 
            'aurexa_alerts', 'aurexa_settings', 'aurexa_audit_logs', 'aurexa_certificates'
        ];

        const DB = {
            get: (key) => JSON.parse(localStorage.getItem(key) || '[]'),
            getObj: (key) => JSON.parse(localStorage.getItem(key) || '{}'),
            set: (key, val) => localStorage.setItem(key, JSON.stringify(val)),
            add: (key, item) => {
                const data = DB.get(key);
                item.id = Date.now().toString(36) + Math.random().toString(36).substr(2);
                item.createdAt = new Date().toISOString();
                data.push(item);
                DB.set(key, data);
                return item;
            },
            update: (key, id, updates) => {
                const data = DB.get(key);
                const index = data.findIndex(i => i.id === id);
                if(index > -1) { data[index] = { ...data[index], ...updates, updatedAt: new Date().toISOString() }; DB.set(key, data); }
            },
            remove: (key, id) => DB.set(key, DB.get(key).filter(i => i.id !== id)),
            log: (action, user = 'System') => DB.add('aurexa_audit_logs', { action, user, date: new Date().toLocaleString() })
        };

        /*******************************************************
         * 2. INITIALIZE DEMO DATA
         *******************************************************/
        function initDemoData() {
            if(!localStorage.getItem('aurexa_settings')) {
                DB.set('aurexa_settings', {
                    siteName: 'Aurexa', 
                    founderName: 'Srikanth Paka',
                    founderRole: 'Founder & CEO — Aurexa',
                    founderBio: 'Passionate about bridging the gap between theoretical knowledge and practical industry requirements. Srikanth founded Aurexa to empower students with real-world cybersecurity and technology skills.',
                    founderMsg: '“Aurexa is built with a vision to make practical technology and cybersecurity learning more accessible, meaningful and career-focused for the next generation.”',
                    email: 'hello@aurexa.space', phone: '+91 98765 43210', location: 'Hyderabad, India',
                    announcement: { active: true, msg: '🚀 New cybersecurity learning programs are now available.', type: 'info' }
                });

                DB.add('aurexa_courses', { title: 'Ethical Hacking Fundamentals', category: 'Cybersecurity', level: 'Beginner', duration: '4 Weeks', price: 'Free', rating: 4.8, students: 1250, instructor: 'Srikanth Paka', desc: 'Learn the core concepts of offensive security, networking, and vulnerability assessment.', img: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=500' });
                DB.add('aurexa_courses', { title: 'Advanced SOC Operations', category: 'SOC', level: 'Advanced', duration: '8 Weeks', price: '$49', rating: 4.9, students: 840, instructor: 'Aurexa Team', desc: 'Master SIEM tools, log analysis, threat hunting, and incident response.', img: 'https://images.unsplash.com/photo-1551808525-51a94da548ce?w=500' });
                
                DB.add('aurexa_workshops', { title: 'Web App PenTesting Bootcamp', speaker: 'Srikanth Paka', date: '2026-09-15', time: '10:00 AM', location: 'Online', seats: 100, status: 'Open', desc: 'Hands-on live session finding and exploiting common web vulnerabilities.' });
                
                DB.add('aurexa_projects', { title: 'AI Phishing Detector', category: 'AI Security', tech: 'Python, Scikit-learn', status: 'Approved', desc: 'Machine learning model to classify malicious URLs with 98% accuracy.', img: 'https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=500' });
                
                DB.add('aurexa_faqs', { q: 'Do I get a certificate?', a: 'Yes, all completed courses come with a verifiable digital certificate.' });
                
                DB.add('aurexa_users', { name: 'Demo Student', email: 'student@example.com', role: 'Student', password: 'demo' });
                
                DB.log('System initialized with demo data');
            }
        }

        /*******************************************************
         * 3. UI UTILITIES
         *******************************************************/
        function showToast(msg, type = 'success') {
            const root = document.getElementById('toast-root');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span style="font-size:1.5rem">${type==='success'?'✅':type==='error'?'❌':'ℹ️'}</span> <div>${msg}</div>`;
            root.appendChild(toast);
            setTimeout(() => { toast.style.opacity = 0; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function openModal(content) {
            const root = document.getElementById('modal-root');
            root.innerHTML = `
                <div class="modal-overlay active" id="modal-overlay" onclick="if(event.target.id==='modal-overlay') closeModal()">
                    <div class="modal-content">
                        <button class="modal-close" onclick="closeModal()">×</button>
                        ${content}
                    </div>
                </div>
            `;
            document.body.style.overflow = 'hidden';
        }
        function closeModal() { document.getElementById('modal-root').innerHTML = ''; document.body.style.overflow = 'auto'; }

        // Ctrl+K Search
        document.addEventListener('keydown', e => {
            if((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                openModal(`
                    <h3 class="text-2xl font-bold mb-4">Global Search</h3>
                    <input type="text" class="input-control" placeholder="Search courses, workshops, projects..." onkeyup="handleSearch(this.value)" id="searchInput" autocomplete="off">
                    <div id="searchResults" class="mt-4 flex col gap-2"></div>
                `);
                setTimeout(() => document.getElementById('searchInput').focus(), 100);
            }
        });

        window.handleSearch = (query) => {
            const res = document.getElementById('searchResults');
            if(query.length < 2) { res.innerHTML = ''; return; }
            const q = query.toLowerCase();
            let html = '';
            
            DB.get('aurexa_courses').filter(c => c.title.toLowerCase().includes(q)).forEach(c => html += `<div class="p-2 border rounded bg-bg text-sm"><strong>Course:</strong> ${c.title}</div>`);
            DB.get('aurexa_workshops').filter(w => w.title.toLowerCase().includes(q)).forEach(w => html += `<div class="p-2 border rounded bg-bg text-sm"><strong>Workshop:</strong> ${w.title}</div>`);
            DB.get('aurexa_projects').filter(p => p.title.toLowerCase().includes(q)).forEach(p => html += `<div class="p-2 border rounded bg-bg text-sm"><strong>Project:</strong> ${p.title}</div>`);
            
            res.innerHTML = html || '<p class="text-text-light text-sm">No results found.</p>';
        };

        /*******************************************************
         * 4. RENDERERS: PUBLIC WEBSITE
         *******************************************************/
        function renderNavbar() {
            const settings = DB.getObj('aurexa_settings');
            const ann = settings.announcement;
            const bar = ann && ann.active ? `<div id="announcement">${ann.msg}</div>` : '';
            const isStudent = sessionStorage.getItem('aurexa_student');
            
            return `

                <header>
                    <div class="container nav-container">
                        <a href="#home" class="logo">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                            AUREXA
                        </a>
                        <nav class="nav-links">
                            <a href="#home">Home</a> <a href="#courses">Courses</a> <a href="#workshops">Workshops</a> 
                            <a href="#projects">Projects</a> <a href="#founder">Founder</a>
                        </nav>
                        <div class="flex gap-4 items-center">
                            <button onclick="alert('Press Ctrl+K to search')" class="text-text-light" title="Search">🔍</button>
                            ${isStudent ? 
                                `<a href="#dashboard" class="btn btn-outline text-sm">Dashboard</a>
                                 <button onclick="logoutStudent()" class="text-text-light text-sm">Logout</button>` : 
                                `<button onclick="openLoginModal()" class="text-text-light font-semibold">Login</button>
                                 <a href="#courses" class="btn btn-primary text-sm">Get Started</a>`
                            }
                            <a href="#admin" class="text-sm text-text-light ml-2 border-l pl-4 border-border">Admin</a>
                        </div>
                    </div>
                </header>
            `;
        }

        function renderFooter() {
            return `
                <footer>
                    <div class="container grid grid-cols-4 gap-8">
                        <div class="col-span-1">
                            <h3 class="logo text-white"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> AUREXA</h3>
                            <p class="text-sm text-text-light mb-4">Empowering the Next Generation of Cybersecurity & Technology.</p>
                            <form onsubmit="submitNewsletter(event)" class="flex gap-2">
                                <input type="email" id="nlEmail" placeholder="Email address" class="input-control text-sm" required style="padding:0.5rem">
                                <button class="btn btn-primary text-sm" style="padding:0.5rem 1rem">Subscribe</button>
                            </form>
                        </div>
                        <div><h3>Explore</h3><ul><li><a href="#courses">Courses</a></li><li><a href="#workshops">Workshops</a></li><li><a href="#projects">Projects</a></li></ul></div>
                        <div><h3>Company</h3><ul><li><a href="#founder">Founder</a></li><li><a href="#about">About Us</a></li><li><a href="#contact">Contact</a></li></ul></div>
                        <div><h3>Legal</h3><ul><li><a href="#" onclick="alert('Demo Privacy Policy')">Privacy Policy</a></li><li><a href="#" onclick="alert('Demo Terms')">Terms of Service</a></li></ul></div>
                    </div>
                    <div class="container text-center text-sm text-text-light mt-8 pt-8" style="border-top: 1px solid rgba(255,255,255,0.1)">
                        &copy; 2026 Aurexa. All rights reserved. Built by Srikanth Paka.
                    </div>
                </footer>

        }

        function renderHome() {
            const courses = DB.get('aurexa_courses').slice(0, 3);
            const settings = DB.getObj('aurexa_settings');
            
            return `
                <section class="hero" id="home">
                    <div class="container relative" style="z-index: 10;">
                        <span class="badge mb-4">CYBERSECURITY • TECHNOLOGY • INNOVATION</span>

                        <div><div class="text-4xl font-bold text-accent mb-2">${DB.get('aurexa_courses').length}+</div><div class="text-sm text-text-light font-semibold">Courses</div></div>
                        <div><div class="text-4xl font-bold text-accent mb-2">${DB.get('aurexa_projects').length}+</div><div class="text-sm text-text-light font-semibold">Projects Built</div></div>
                        <div><div class="text-4xl font-bold text-accent mb-2">10k+</div><div class="text-sm text-text-light font-semibold">Community Members</div></div>
                    </div>
                </section>

                <section class="py-16" id="services">
                    <div class="container">
                        <div class="section-header"><h2>Core Services</h2><p>Comprehensive tech & security education.</p></div>
                        <div class="grid grid-cols-4 gap-6">

                                <div class="card text-center"><div class="text-4xl mb-4">💠</div><h3 class="font-bold text-lg mb-2">${s}</h3><p class="text-sm text-text-light">Practical, industry-aligned modules.</p></div>
                            `).join('')}
                        </div>
                    </div>
                </section>

                <section class="py-16 bg-white" id="courses">
                    <div class="container">
                        <div class="section-header"><h2>Featured Courses</h2><p>Learn from industry experts with hands-on labs.</p></div>
                        <div class="grid grid-cols-3 gap-6">
                            ${courses.map(c => `
                                <div class="card" style="padding:0; overflow:hidden;">
                                    <img src="${c.img}" class="course-img" style="margin:0; border-radius:0;">
                                    <div class="p-6">
                                        <div class="flex gap-2 mb-2"><span class="badge">${c.category}</span><span class="badge">${c.level}</span></div>
                                        <h3 class="font-bold text-xl mb-2">${c.title}</h3>
                                        <p class="text-sm text-text-light mb-4" style="height: 40px; overflow:hidden;">${c.desc}</p>
                                        <div class="flex justify-between items-center mt-4 pt-4 border-t border-border">
                                            <span class="font-bold text-lg">${c.price}</span>
                                            <button onclick="viewCourse('${c.id}')" class="text-accent font-semibold text-sm">View Details →</button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </section>

                <section class="py-16" id="founder">
                    <div class="container flex gap-8 items-center bg-primary text-white rounded p-8" style="border-radius:24px;">
                        <img src="https://images.unsplash.com/photo-1556157382-97eda2d62296?w=500" alt="Founder" class="founder-img" style="flex-shrink:0">
                        <div>
                            <h2 class="text-4xl font-bold mb-2">Meet the Founder</h2>
                            <h3 class="text-xl text-info mb-4">${settings.founderName} <span class="text-sm text-gray-400 font-normal">| ${settings.founderRole}</span></h3>
                            <p class="mb-6 text-gray-300">${settings.founderBio}</p>
                            <blockquote class="p-4 border-l-4 border-accent bg-secondary rounded text-sm italic">
                                ${settings.founderMsg}
                            </blockquote>
                        </div>
                    </div>
                </section>

                <section class="py-16 bg-white" id="contact">
                    <div class="container max-w-2xl" style="max-width: 600px; margin: 0 auto;">
                        <div class="section-header"><h2>Contact Us</h2><p>Have questions? Reach out to the Aurexa team.</p></div>
                        <form class="card" onsubmit="submitContact(event)">
                            <div class="input-group"><label>Name</label><input type="text" id="cName" class="input-control" required></div>
                            <div class="input-group"><label>Email</label><input type="email" id="cEmail" class="input-control" required></div>
                            <div class="input-group"><label>Message</label><textarea id="cMsg" class="input-control" rows="4" required></textarea></div>
                            <button type="submit" class="btn btn-primary w-full" style="width:100%">Send Message</button>
                        </form>
                    </div>
                </section>
            `;
        }

        window.viewCourse = (id) => {
            const c = DB.get('aurexa_courses').find(x => x.id === id);
            if(!c) return;
            openModal(`
                <span class="badge mb-2">${c.category}</span>
                <h2 class="text-2xl font-bold mb-4">${c.title}</h2>
                <img src="${c.img}" style="width:100%; height:250px; object-fit:cover; border-radius:8px; margin-bottom:1rem;">
                <p class="mb-4">${c.desc}</p>
                <div class="grid grid-cols-2 gap-4 text-sm mb-6 bg-bg p-4 rounded">
                    <div><strong>Level:</strong> ${c.level}</div>
                    <div><strong>Duration:</strong> ${c.duration}</div>
                    <div><strong>Instructor:</strong> ${c.instructor}</div>
                    <div><strong>Rating:</strong> ⭐ ${c.rating} (${c.students} students)</div>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-2xl font-bold">${c.price}</span>
                    <button class="btn btn-primary" onclick="enrollCourse('${c.id}')">Enroll Now</button>
                </div>
            `);
        }

        window.enrollCourse = (id) => {
            if(!sessionStorage.getItem('aurexa_student')) {
                closeModal(); showToast('Please login to enroll', 'warning'); openLoginModal(); return;
            }
            DB.add('aurexa_notifications', { type: 'enrollment', message: `New enrollment for course ${id}` });
            showToast('Successfully enrolled in the course!');
            closeModal();
            window.location.hash = '#dashboard';
        }

        // Form Submissions
        window.submitContact = (e) => {
            e.preventDefault();
            DB.add('aurexa_messages', { name: document.getElementById('cName').value, email: document.getElementById('cEmail').value, msg: document.getElementById('cMsg').value, status: 'New' });
            showToast('Message sent successfully!');
            e.target.reset();
        }
        window.submitNewsletter = (e) => {
            e.preventDefault();
            DB.add('aurexa_subscribers', { email: document.getElementById('nlEmail').value });
            showToast('Subscribed successfully!');
            e.target.reset();
        }

        // Mock Auth
        window.openLoginModal = () => {
            openModal(`
                <h2 class="text-2xl font-bold mb-6 text-center">Student Login</h2>
                <form onsubmit="handleStudentLogin(event)">
                    <div class="input-group"><label>Email</label><input type="email" id="lEmail" class="input-control" value="student@example.com" required></div>
                    <div class="input-group"><label>Password</label><input type="password" id="lPass" class="input-control" value="demo" required></div>
                    <button class="btn btn-primary w-full mt-4" style="width:100%">Login</button>
                </form>
                <p class="text-center text-xs text-text-light mt-4">Demo accounts: student@example.com / demo</p>
            `);
        }
        window.handleStudentLogin = (e) => {
            e.preventDefault();
            sessionStorage.setItem('aurexa_student', document.getElementById('lEmail').value);
            showToast('Logged in successfully');
            closeModal();
            renderApp();
        }
        window.logoutStudent = () => { sessionStorage.removeItem('aurexa_student'); renderApp(); showToast('Logged out'); }

        /*******************************************************
         * 5. STUDENT DASHBOARD
         *******************************************************/
        function renderStudentDashboard() {
            if(!sessionStorage.getItem('aurexa_student')) { window.location.hash = '#home'; return ''; }
            const courses = DB.get('aurexa_courses').slice(0, 2); // mock enrolled
            return `
                <div class="container py-16">
                    <h2 class="text-3xl font-bold mb-8">Student Dashboard</h2>
                    <div class="grid grid-cols-3 gap-6 mb-8">
                        <div class="card text-center"><div class="text-3xl text-accent font-bold">2</div><div class="text-sm text-text-light">Enrolled Courses</div></div>
                        <div class="card text-center"><div class="text-3xl text-success font-bold">1</div><div class="text-sm text-text-light">Certificates</div></div>
                        <div class="card text-center"><div class="text-3xl text-info font-bold">3</div><div class="text-sm text-text-light">Projects Submitted</div></div>
                    </div>
                    <h3 class="text-xl font-bold mb-4">My Learning</h3>
                    <div class="grid grid-cols-2 gap-6">
                        ${courses.map(c => `
                            <div class="card flex gap-4 items-center">
                                <img src="${c.img}" style="width:100px; height:100px; object-fit:cover; border-radius:8px;">
                                <div style="flex:1">
                                    <h4 class="font-bold">${c.title}</h4>
                                    <div class="w-full bg-bg rounded h-2 mt-2 mb-2"><div class="bg-accent h-2 rounded" style="width: 45%"></div></div>
                                    <div class="flex justify-between text-xs text-text-light"><span>45% Complete</span> <button class="text-accent font-bold">Continue</button></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        /*******************************************************
         * 6. ADMIN PANEL
         *******************************************************/
        function renderAdminLogin() {
            return `
                <div class="flex items-center justify-center" style="min-height:100vh; background:var(--bg)">
                    <div class="card" style="width:100%; max-width:400px;">
                        <h2 class="text-2xl font-bold text-center mb-2">Admin Access</h2>
                        <p class="text-center text-sm text-danger mb-6">Demo Frontend Authentication Only</p>
                        <form onsubmit="handleAdminLogin(event)">
                            <div class="input-group"><label>Username</label><input type="text" id="aUser" class="input-control" value="admin" required></div>
                            <div class="input-group"><label>Password</label><input type="password" id="aPass" class="input-control" value="Aurexa@2026" required></div>
                            <button class="btn btn-primary mt-4 w-full" style="width:100%">Secure Login</button>
                        </form>
                    </div>
                </div>
            `;
        }

        window.handleAdminLogin = (e) => {
            e.preventDefault();
            if(document.getElementById('aUser').value === ADMIN_CREDS.user && document.getElementById('aPass').value === ADMIN_CREDS.pass) {
                sessionStorage.setItem('aurexa_admin', 'true');
                DB.log('Admin Login');
                window.location.hash = '#admin/dashboard';
                renderApp();
                showToast('Admin logged in');
            } else { showToast('Invalid credentials', 'error'); }
        }
        window.logoutAdmin = () => { sessionStorage.removeItem('aurexa_admin'); DB.log('Admin Logout'); window.location.hash = '#home'; renderApp(); }

        function renderAdminLayout(content, activeRoute) {
            const nav = [
                { id: 'dashboard', label: '📊 Dashboard' }, { id: 'courses', label: '📚 Courses' },
                { id: 'workshops', label: '🛠️ Workshops' }, { id: 'projects', label: '💻 Projects' },
                { id: 'users', label: '👥 Users' }, { id: 'messages', label: '✉️ Messages' },
                { id: 'settings', label: '⚙️ Settings & Backup' }
            ];
            return `
                <div class="admin-layout">
                    <aside class="admin-sidebar">
                        <div class="logo">Aurexa Admin</div>
                        <nav class="admin-nav">
                            ${nav.map(n => `<a href="#admin/${n.id}" class="${activeRoute === n.id ? 'active' : ''}">${n.label}</a>`).join('')}
                        </nav>
                    </aside>
                    <main class="admin-main">
                        <header class="admin-header">
                            <h2 class="font-bold text-xl capitalize">${activeRoute}</h2>
                            <div class="flex gap-4 items-center">
                                <a href="#home" class="btn btn-outline text-sm py-1">View Site</a>
                                <button onclick="logoutAdmin()" class="btn btn-danger text-sm py-1">Logout</button>
                            </div>
                        </header>
                        <div class="admin-content">${content}</div>
                    </main>
                </div>
            `;
        }

        function renderAdminDashboard() {
            return `
                <div class="grid grid-cols-4 gap-6 mb-8">
                    <div class="card text-center"><div class="text-3xl font-bold text-primary">${DB.get('aurexa_users').length}</div><div class="text-sm text-text-light">Total Users</div></div>
                    <div class="card text-center"><div class="text-3xl font-bold text-accent">${DB.get('aurexa_courses').length}</div><div class="text-sm text-text-light">Active Courses</div></div>
                    <div class="card text-center"><div class="text-3xl font-bold text-success">${DB.get('aurexa_projects').length}</div><div class="text-sm text-text-light">Projects</div></div>
                    <div class="card text-center"><div class="text-3xl font-bold text-warning">${DB.get('aurexa_messages').length}</div><div class="text-sm text-text-light">Messages</div></div>
                </div>
                <div class="card mb-8">
                    <h3 class="font-bold mb-4">Engagement Overview (Demo Chart)</h3>
                    <div class="chart-container">
                        ${[40, 70, 45, 90, 65, 80, 100].map(h => `<div class="chart-bar" style="height:${h}%" title="${h} units"></div>`).join('')}
                    </div>
                    <div class="flex gap-4 mt-4 text-xs text-text-light justify-center"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
                </div>
                <div class="card">
                    <h3 class="font-bold mb-4">Recent Audit Logs</h3>
                    <div style="max-height: 200px; overflow-y:auto; font-size:0.875rem;">
                        ${DB.get('aurexa_audit_logs').reverse().slice(0, 10).map(l => `<div class="p-2 border-b border-border flex justify-between"><span><strong>${l.action}</strong> by ${l.user}</span> <span class="text-text-light">${l.date}</span></div>`).join('')}
                    </div>
                </div>
            `;
        }

        // Generic DataTable Generator to save space
        function renderAdminTable(title, key, columns, canAdd = true) {
            const data = DB.get(key);
            let html = `<div class="flex justify-between items-center mb-6"><h3 class="font-bold text-xl">${title}</h3>`;
            if(canAdd) html += `<button class="btn btn-primary text-sm" onclick="alert('Demo: Form builder would open here.')">+ Add New</button>`;
            html += `</div><div style="overflow-x:auto;"><table><thead><tr>`;
            columns.forEach(c => html += `<th>${c.label}</th>`);
            html += `<th>Actions</th></tr></thead><tbody>`;
            
            if(data.length === 0) html += `<tr><td colspan="${columns.length+1}" class="text-center py-4">No records found.</td></tr>`;
            
            data.forEach(row => {
                html += `<tr>`;
                columns.forEach(c => html += `<td>${c.format ? c.format(row[c.key]) : (row[c.key] || '-')}</td>`);
                html += `<td>
                    <button class="text-info font-bold text-sm mr-2" onclick="alert('Edit ${row.id}')">Edit</button>
                    <button class="text-danger font-bold text-sm" onclick="deleteRecord('${key}', '${row.id}')">Del</button>
                </td></tr>`;
            });
            html += `</tbody></table></div>`;
            return html;
        }

        window.deleteRecord = (key, id) => {
            if(confirm('Are you sure you want to delete this record?')) {
                DB.remove(key, id);
                DB.log(`Deleted record from ${key}`);
                showToast('Record deleted');
                renderApp();
            }
        }

        function renderAdminSettings() {
            return `
                <div class="grid grid-cols-2 gap-6">
                    <div class="card">
                        <h3 class="font-bold mb-4">Data Management</h3>
                        <p class="text-sm text-text-light mb-4">Export all database records as JSON, or export specific tables to CSV.</p>
                        <div class="flex col gap-2">
                            <button class="btn btn-primary w-full" onclick="exportDataJSON()">Download Full JSON Backup</button>
                            <button class="btn btn-outline w-full" onclick="exportCSV('aurexa_users')">Export Users CSV</button>
                            <button class="btn btn-outline w-full" onclick="exportCSV('aurexa_courses')">Export Courses CSV</button>
                        </div>
                    </div>
                    <div class="card border-danger">
                        <h3 class="font-bold mb-4 text-danger">Danger Zone</h3>
                        <p class="text-sm text-text-light mb-4">Resetting data will erase all current local storage keys and re-initialize demo data.</p>
                        <button class="btn btn-danger" onclick="resetSystemData()">Reset Demo Data</button>
                    </div>
                </div>
            `;
        }

        window.exportDataJSON = () => {
            let backup = {};
            DB_KEYS.forEach(k => backup[k] = DB.get(k));
            const blob = new Blob([JSON.stringify(backup, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `aurexa_backup_${Date.now()}.json`; a.click();
            DB.log('Exported Full JSON Backup');
        }
        
        window.exportCSV = (key) => {
            const data = DB.get(key);
            if(!data.length) { showToast('No data to export', 'warning'); return; }
            const headers = Object.keys(data[0]).join(',');
            const rows = data.map(obj => Object.values(obj).map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
            const blob = new Blob([headers + '\n' + rows], {type: 'text/csv'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${key}.csv`; a.click();
            DB.log(`Exported CSV for ${key}`);
        }

        window.resetSystemData = () => {
            if(confirm('WARNING: All data will be lost. Proceed?')) {
                localStorage.clear();
                showToast('System reset. Reloading...');
                setTimeout(() => window.location.reload(), 1000);
            }
        }

        /*******************************************************
         * 7. ROUTING & CORE RENDER LOOP
         *******************************************************/
        function renderApp() {
            const app = document.getElementById('app');
            const hash = window.location.hash || '#home';
            
            if(hash.startsWith('#admin')) {
                if(!sessionStorage.getItem('aurexa_admin')) { app.innerHTML = renderAdminLogin(); return; }
                
                const route = hash.split('/')[1] || 'dashboard';
                let content = '';
                
                if(route === 'dashboard') content = renderAdminDashboard();
                else if(route === 'courses') content = renderAdminTable('Course Management', 'aurexa_courses', [{label:'Title', key:'title'}, {label:'Category', key:'category'}, {label:'Price', key:'price'}]);
                else if(route === 'workshops') content = renderAdminTable('Workshop Management', 'aurexa_workshops', [{label:'Title', key:'title'}, {label:'Date', key:'date'}, {label:'Status', key:'status'}]);
                else if(route === 'projects') content = renderAdminTable('Project Submissions', 'aurexa_projects', [{label:'Title', key:'title'}, {label:'Category', key:'category'}, {label:'Status', key:'status'}]);
                else if(route === 'users') content = renderAdminTable('User Management', 'aurexa_users', [{label:'Name', key:'name'}, {label:'Email', key:'email'}, {label:'Role', key:'role'}], false);
                else if(route === 'messages') content = renderAdminTable('Contact Messages', 'aurexa_messages', [{label:'Name', key:'name'}, {label:'Email', key:'email'}, {label:'Status', key:'status'}], false);
                else if(route === 'settings') content = renderAdminSettings();
                
                app.innerHTML = renderAdminLayout(content, route);
            } 
            else if(hash === '#dashboard') {
                app.innerHTML = renderNavbar() + renderStudentDashboard() + renderFooter();
            }
            else {
                // Public SPA Pages
                app.innerHTML = renderNavbar() + renderHome() + renderFooter();
                // Handle scroll if hash corresponds to an ID in home
                if(hash !== '#home' && document.querySelector(hash)) {
                    setTimeout(() => document.querySelector(hash).scrollIntoView({behavior: 'smooth'}), 100);
                }
            }
        }

        // Init
        window.addEventListener('hashchange', renderApp);
        window.addEventListener('load', () => { initDemoData(); renderApp(); });

    </script>
</body>
</html>
