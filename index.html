<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#05070b" />

    <meta
      name="description"
      content="Aurexa is a next-generation cybersecurity platform focused on ethical hacking, AI security, cyber defense, security research, and digital protection."
    />

    <meta
      name="keywords"
      content="Aurexa, cybersecurity, ethical hacking, cyber security, AI security, penetration testing, digital defense, security research, cyber defense"
    />

    <meta name="author" content="Aurexa" />

    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://aurexa.example/" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Aurexa | Next-Generation Cybersecurity"
    />

    <meta
      property="og:description"
      content="AI-powered cybersecurity, ethical hacking, security research, and digital defense."
    />

    <meta
      property="og:url"
      content="https://aurexa.example/"
    />

    <meta
      property="og:site_name"
      content="Aurexa"
    />

    <meta
      property="og:image"
      content="/og-image.png"
    />

    <meta
      property="og:image:alt"
      content="Aurexa Cybersecurity"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Aurexa | Next-Generation Cybersecurity"
    />

    <meta
      name="twitter:description"
      content="AI-powered cybersecurity and intelligent digital defense."
    />

    <meta
      name="twitter:image"
      content="/og-image.png"
    />

    <!-- Security / Browser hints -->
    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />

    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <!-- Prevent theme flash -->
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("aurexa-theme");

          if (savedTheme === "light") {
            document.documentElement.classList.add("light");
          } else {
            document.documentElement.classList.add("dark");
          }
        } catch (error) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <!-- Initial Loading Screen -->
    <style>
      :root {
        color-scheme: dark;
        background: #05070b;
      }

      * {
        box-sizing: border-box;
      }

      html {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #05070b;
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        background: #05070b;
        color: #ffffff;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body::selection {
        background: #00ffae;
        color: #05070b;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      img {
        max-width: 100%;
        display: block;
      }

      #root {
        min-height: 100vh;
      }

      /* Initial Loader */

      #aurexa-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 22px;
        background:
          radial-gradient(
            circle at 50% 45%,
            rgba(0, 255, 174, 0.08),
            transparent 30%
          ),
          radial-gradient(
            circle at 50% 50%,
            rgba(0, 150, 255, 0.05),
            transparent 50%
          ),
          #05070b;
        transition:
          opacity 0.45s ease,
          visibility 0.45s ease;
      }

      #aurexa-loader.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .aurexa-loader-logo {
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(38px, 8vw, 68px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -3px;
        color: #ffffff;
        text-transform: uppercase;
      }

      .aurexa-loader-logo span {
        color: #00ffae;
      }

      .aurexa-loader-status {
        display: flex;
        align-items: center;
        gap: 9px;
        color: rgba(255, 255, 255, 0.5);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .aurexa-loader-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #00ffae;
        box-shadow: 0 0 15px rgba(0, 255, 174, 0.8);
        animation: aurexa-pulse 1.2s ease-in-out infinite;
      }

      .aurexa-loader-bar {
        position: relative;
        width: min(180px, 55vw);
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .aurexa-loader-bar::after {
        content: "";
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #00ffae;
        box-shadow: 0 0 12px rgba(0, 255, 174, 0.8);
        animation: aurexa-loading 1.1s ease-in-out infinite;
      }

      @keyframes aurexa-loading {
        0% {
          left: -40%;
        }

        100% {
          left: 100%;
        }
      }

      @keyframes aurexa-pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.85);
        }

        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* No JavaScript fallback */

      .aurexa-noscript {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
        background: #05070b;
        color: white;
        text-align: center;
      }

      .aurexa-noscript-box {
        max-width: 550px;
      }

      .aurexa-noscript-box h1 {
        margin: 0 0 12px;
        font-family: "Space Grotesk", sans-serif;
      }

      .aurexa-noscript-box p {
        margin: 0;
        color: rgba(255, 255, 255, 0.65);
        line-height: 1.7;
      }

      /* Accessibility */

      .skip-link {
        position: fixed;
        top: -100px;
        left: 20px;
        z-index: 1000000;
        padding: 10px 16px;
        border-radius: 8px;
        background: #00ffae;
        color: #05070b;
        font-weight: 700;
        transition: top 0.2s ease;
      }

      .skip-link:focus {
        top: 20px;
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Aurexa",
        "url": "https://aurexa.example/",
        "description": "Next-generation cybersecurity and digital defense platform.",
        "logo": "https://aurexa.example/logo.png"
      }
    </script>
  </head>

  <body>
    <!-- Accessibility -->
    <a
      href="#main-content"
      class="skip-link"
    >
      Skip to content
    </a>

    <!-- Loading Screen -->
    <div
      id="aurexa-loader"
      aria-label="Loading Aurexa"
      role="status"
    >
      <div class="aurexa-loader-logo">
        AURE<span>XA</span>
      </div>

      <div class="aurexa-loader-status">
        <span class="aurexa-loader-dot"></span>
        Initializing secure environment
      </div>

      <div class="aurexa-loader-bar"></div>
    </div>

    <!-- JavaScript Disabled -->
    <noscript>
      <div class="aurexa-noscript">
        <div class="aurexa-noscript-box">
          <h1>Aurexa requires JavaScript</h1>

          <p>
            JavaScript is required to run the Aurexa cybersecurity
            platform. Please enable JavaScript in your browser and
            reload the page.
          </p>
        </div>
      </div>
    </noscript>

    <!-- React Application -->
    <div id="root"></div>

    <!-- Application Bootstrap -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Loader Controller -->
    <script>
      (() => {
        const loader = document.getElementById("aurexa-loader");

        if (!loader) return;

        const hideLoader = () => {
          loader.classList.add("hide");

          setTimeout(() => {
            if (loader && loader.parentNode) {
              loader.remove();
            }
          }, 500);
        };

        if (document.readyState === "complete") {
          setTimeout(hideLoader, 450);
        } else {
          window.addEventListener(
            "load",
            () => {
              setTimeout(hideLoader, 450);
            },
            { once: true }
          );
        }

        // Safety fallback
        setTimeout(hideLoader, 5000);
      })();
    </script>
  </body>
</html>
